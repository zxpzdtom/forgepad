[package]
name = "forgepad-core"
version = "0.1.0"
edition = "2021"
description = "Core ForgePad services shared by native hosts."

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ignore = "0.4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "forgepad-core-daemon"
path = "src/bin/forgepad-core-daemon.rs"

[dev-dependencies]
tempfile = "3"
